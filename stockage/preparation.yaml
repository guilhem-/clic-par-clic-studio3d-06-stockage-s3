# Job de préparation du stockage (module s3d06) : bucket, cycle de vie, politiques, comptes.
# MODE : --preparer (défaut), --vider ou --essai (remplacé par deployer.mjs / deployer.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: preparation
  namespace: stockage
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: preparation }     # autorisé par la règle d'entrée s3-entrees
    spec:
      restartPolicy: Never
      volumes:
        - name: config
          configMap:
            name: stockage-config
            items:
              - { key: depot.json, path: politiques/depot.json }
              - { key: liens.json, path: politiques/liens.json }
              - { key: consultation.json, path: politiques/consultation.json }
              - { key: cycle-de-vie.json, path: cycle-de-vie.json }
      containers:
        - name: preparation
          image: stockage-preparation:1
          imagePullPolicy: IfNotPresent
          args: ["python", "preparer.py", "MODE"]
          env:
            - { name: S3_INTERNE, value: "http://s3.stockage.svc.cluster.local:9000" }
            - { name: RACINE_CLE, valueFrom: { secretKeyRef: { name: s3-racine, key: cle } } }
            - { name: RACINE_SECRET, valueFrom: { secretKeyRef: { name: s3-racine, key: secret } } }
            - { name: DEPOT_SECRET, valueFrom: { secretKeyRef: { name: comptes, key: depot-secret } } }
            - { name: LIENS_SECRET, valueFrom: { secretKeyRef: { name: comptes, key: liens-secret } } }
            - { name: CONSULTATION_SECRET, valueFrom: { secretKeyRef: { name: comptes, key: consultation-secret } } }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
