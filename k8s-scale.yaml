# 3D studio at scale (module s3d02): shared Redis queue, MCP server in two copies, Blender workers
# from 0 to 4, their number driven by KEDA according to the queue. Replaces the simple studio (k8s.yaml):
# same "studio" service, same Traefik entry: for Open WebUI, nothing changes.
# Module s3d03: image studio3d:3 and prometheus.io/* annotations (metrics read by observability/).
# Module s3d04: policy for the visible marking of the renders (MARKING_VISIBLE_*, on studio-api).
# Module s3d05: image studio3d:4 and asset library (image studio3d-assets:<version>, mounted
#   read-only on /assets by the Kubernetes "image" volume, in the server and the workers).
# Module s3d06: image studio3d:5; Blender scene uploaded to the storage team's S3 storage. The keys
#   ("storage" secret, optional: without it, nothing changes) go to the MCP server only; the workers
#   receive temporary credentials through Redis. Egress rule: k8s-storage.yaml.
#   kubectl apply -f k8s-scale.yaml   (after the "studio" secret: keys token and redis)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: studio3d
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["sh", "-c", "exec redis-server --requirepass \"$PASSWORD\" --save '' --appendonly no"]
          env:
            - name: PASSWORD
              valueFrom: { secretKeyRef: { name: studio, key: redis } }
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: studio3d
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-api
  namespace: studio3d
spec:
  replicas: 2                        # stateless MCP server: any copy answers
  selector:
    matchLabels: { app: studio-api }
  template:
    metadata:
      labels: { app: studio-api, role: studio }
      annotations:                   # Prometheus reads this pod, on this port (/metrics)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      volumes:
        - name: assets                     # the library: an image, mounted as a folder
          image:
            reference: studio3d-assets:1   # the library version (in production: @sha256:…)
            pullPolicy: IfNotPresent       # already in the node cache: nothing to download
      containers:
        - name: api
          image: studio3d:5
          imagePullPolicy: IfNotPresent
          command: ["python", "api.py"]
          ports: [{ containerPort: 8000 }]
          env:
            - name: STUDIO_TOKEN
              valueFrom: { secretKeyRef: { name: studio, key: token } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: studio, key: redis } }
            - name: REDIS_HOST
              value: redis
            - name: STUDIO_PUBLIC_URL
              value: http://studio.localhost:8080
            # The organization's policy for the visible banner (the invisible marking is always applied):
            - name: MARKING_VISIBLE_DEFAULT    # "yes": banner when the user does not say
              value: "no"
            - name: MARKING_VISIBLE_ENFORCED   # "yes": banner always, whatever the user asks
              value: "no"
            # Scene storage (module s3d06): the long-term keys, here only.
            - name: S3_INTERNAL                # to ask for temporary credentials
              value: http://s3.storage.svc.cluster.local:9000
            - name: S3_PUBLIC                  # to sign the links: the address seen from the browser
              value: http://s3.localhost:8080
            - name: S3_UPLOAD_KEY
              valueFrom: { secretKeyRef: { name: storage, key: upload-key, optional: true } }
            - name: S3_UPLOAD_SECRET
              valueFrom: { secretKeyRef: { name: storage, key: upload-secret, optional: true } }
            - name: S3_LINKS_KEY
              valueFrom: { secretKeyRef: { name: storage, key: links-key, optional: true } }
            - name: S3_LINKS_SECRET
              valueFrom: { secretKeyRef: { name: storage, key: links-secret, optional: true } }
          volumeMounts:
            - { name: assets, mountPath: /assets, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: studio                       # same name as in module s3d01: the address seen by Open WebUI does not change
  namespace: studio3d
spec:
  selector: { app: studio-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-worker
  namespace: studio3d
spec:
  replicas: 0                        # driven by KEDA (ScaledObject below)
  selector:
    matchLabels: { app: studio-worker }
  template:
    metadata:
      labels: { app: studio-worker, role: studio }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
    spec:
      terminationGracePeriodSeconds: 120   # when stopping, the worker finishes its current render
      volumes:
        - name: assets                     # same library as the MCP server
          image:
            reference: studio3d-assets:1
            pullPolicy: IfNotPresent
      containers:
        - name: blender
          image: studio3d:5
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          ports: [{ name: metrics, containerPort: 9101 }]
          env:
            - name: STUDIO_TOKEN
              valueFrom: { secretKeyRef: { name: studio, key: token } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: studio, key: redis } }
            - name: REDIS_HOST
              value: redis
            - name: STUDIO_PUBLIC_URL
              value: http://studio.localhost:8080
            - name: ASSETS                 # read by Blender (render.py), read-only
              value: /assets
            - name: S3_INTERNAL            # module s3d06: scene upload, no key here
              value: http://s3.storage.svc.cluster.local:9000
          volumeMounts:
            - { name: assets, mountPath: /assets, readOnly: true }
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { cpu: "4", memory: 4Gi }
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: redis
  namespace: studio3d
spec:
  secretTargetRef:
    - { parameter: password, name: studio, key: redis }
---
# One worker per request waiting or running (up to 4); zero workers when everything is done.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: studio-worker
  namespace: studio3d
spec:
  scaleTargetRef: { name: studio-worker }
  minReplicaCount: 0
  maxReplicaCount: 4
  pollingInterval: 5
  cooldownPeriod: 30
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown: { stabilizationWindowSeconds: 20 }
  triggers:                          # a single measure: requests waiting + running (several triggers would take the maximum, not the sum)
    - type: redis
      authenticationRef: { name: redis }
      metadata: { address: redis.studio3d.svc.cluster.local:6379, listName: "studio:load", listLength: "1" }
---
# Only the renders (signed links) and the library thumbnails are published outside the cluster; /mcp stays internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studio
  namespace: studio3d
spec:
  ingressClassName: traefik
  rules:
    - host: studio.localhost
      http:
        paths:
          - path: /r/
            pathType: Prefix
            backend: { service: { name: studio, port: { number: 8000 } } }
          - path: /a/                      # asset thumbnails: royalty-free, unsigned
            pathType: Prefix
            backend: { service: { name: studio, port: { number: 8000 } } }
---
# Server and workers: no egress, except Redis (and name resolution to find it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-to-redis-only
  namespace: studio3d
spec:
  podSelector: { matchLabels: { role: studio } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ port: 6379, protocol: TCP }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# Redis: reachable by the studio and by KEDA (which reads the queue length), nobody else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-studio-and-keda
  namespace: studio3d
spec:
  podSelector: { matchLabels: { app: redis } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { role: studio } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: keda } }
      ports: [{ port: 6379, protocol: TCP }]
