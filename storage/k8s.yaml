# The organization's object storage (storage team, module s3d06): an S3-compatible service, in its
# own namespace. Product chosen: RustFS 1.0.1 (Apache 2.0), image pinned by digest.
# The service is called "s3", not "rustfs": the role's name outlives a product change.
#   kubectl apply -f k8s.yaml   (after the s3-root and accounts secrets: see deploy.sh)
apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data
  namespace: storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: storage
spec:
  replicas: 1
  strategy: { type: Recreate }        # a single pod writes to the volume
  selector:
    matchLabels: { app: s3 }
  template:
    metadata:
      labels: { app: s3 }
    spec:
      securityContext: { fsGroup: 10001 }  # "rustfs" user of the image
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: s3-data }
      containers:
        - name: rustfs
          # rustfs/rustfs:1.0.1, pinned by its digest (multi-architecture index)
          image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          imagePullPolicy: IfNotPresent
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          env:
            - { name: RUSTFS_VOLUMES, value: /data }
            - { name: RUSTFS_ADDRESS, value: ":9000" }
            - { name: RUSTFS_CONSOLE_ENABLE, value: "true" }
            - { name: RUSTFS_CONSOLE_ADDRESS, value: ":9001" }
            - { name: RUSTFS_REGION, value: us-east-1 }
            - name: RUSTFS_ACCESS_KEY       # the root key: it stays in this namespace
              valueFrom: { secretKeyRef: { name: s3-root, key: key } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: s3-root, key: secret } }
            # Metrics: pushed in OTLP to the collector, which publishes them for Prometheus.
            - { name: RUSTFS_OBS_ENDPOINT, value: "http://otel-collector.storage.svc.cluster.local:4318" }
            - { name: RUSTFS_OBS_METER_INTERVAL, value: "15" }
            - { name: RUSTFS_OBS_TRACES_EXPORT_ENABLED, value: "false" }
            - { name: RUSTFS_OBS_LOGS_EXPORT_ENABLED, value: "false" }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /health, port: 9000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: s3                            # the role's name, not the product's
  namespace: storage
spec:
  selector: { app: s3 }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# Ingress: the studio's namespace (S3 port), Traefik (publication), the prepare Job. Nobody else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s3-ingress
  namespace: storage
spec:
  podSelector: { matchLabels: { app: s3 } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studio3d } } }]
      ports: [{ port: 9000, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ port: 9000, protocol: TCP }, { port: 9001, protocol: TCP }]
    - from: [{ podSelector: { matchLabels: { app: prepare } } }]
      ports: [{ port: 9000, protocol: TCP }]
---
# Publication: download with a signed link, nothing else (no write, no administration).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: s3-public
  namespace: storage
spec:
  entryPoints: [web]
  routes:
    - match: Host(`s3.localhost`) && (Method(`GET`) || Method(`HEAD`))
      kind: Rule
      services: [{ name: s3, port: 9000 }]
---
# RustFS console: published for the demo (in production, it would stay internal).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  namespace: storage
spec:
  ingressClassName: traefik
  rules:
    - host: stockage.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: s3, port: { number: 9001 } } }
---
# OpenTelemetry collector: receives the RustFS metrics (OTLP) and publishes them in Prometheus format
# (port 8889), read by the Prometheus of observability/. RustFS has no /metrics page.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: storage
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      volumes:
        - name: configuration
          configMap: { name: otel-collector }
      containers:
        - name: collector
          # otel/opentelemetry-collector:0.162.0 (core distribution), pinned by digest
          image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/collector.yaml"]
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: prometheus, containerPort: 8889 }
          volumeMounts:
            - { name: configuration, mountPath: /etc/otelcol }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: storage
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: prometheus, port: 8889, targetPort: 8889 }
