# OpenTelemetry collector of the storage (module s3d06): RustFS metrics received in OTLP,
# published again in Prometheus format on port 8889 ("storage" job of observability/).
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 10m
service:
  telemetry:
    logs: { level: warn }
  pipelines:
    metrics: { receivers: [otlp], exporters: [prometheus] }
