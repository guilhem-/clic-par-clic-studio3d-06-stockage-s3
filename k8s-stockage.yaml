# Module s3d06 : le studio peut joindre le service s3 de l'autre espace de noms, et rien d'autre de nouveau.
# Additive à studio-vers-redis-seulement (k8s-echelle.yaml) : appliquée quand le stockage est branché.
#   serveur MCP : identifiants temporaires (STS) ; workers : dépôt de la scène.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-vers-stockage
  namespace: studio3d
spec:
  podSelector: { matchLabels: { role: studio } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: stockage } }
          podSelector: { matchLabels: { app: s3 } }
      ports: [{ port: 9000, protocol: TCP }]
